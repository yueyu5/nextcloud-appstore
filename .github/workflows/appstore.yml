name: clone appstore json

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 时间 12:00 运行（北京时间20:00）
    - cron: '0 12 * * *'
    
permissions:
  contents: write  # 允许写入仓库
  
jobs:
  download-and-publish:
    runs-on: ubuntu-latest

    steps:
    # 步骤1：检出仓库代码
    - name: Checkout repository
      uses: actions/checkout@v6

    # 步骤2：下载文件到 /api/v1/
    - name: Download files
      run: |
        mkdir -p api/v1
        wget -q -O api/v1/apps.json https://apps.nextcloud.com/api/v1/apps.json
        wget -q -O api/v1/discover.json https://apps.nextcloud.com/api/v1/discover.json
        wget -q -O api/v1/categories.json https://apps.nextcloud.com/api/v1/categories.json
        wget -q -O api/v1/appapi_apps.json https://apps.nextcloud.com/api/v1/appapi_apps.json

    # 步骤3：替换 GitHub 镜像源
    - name: Replace github.com with github mirror
      run: |
        sed -i 's|github\.com|v6.gh-proxy.org/https://github.com|g' api/v1/apps.json
        sed -i 's|github\.com|v6.gh-proxy.org/https://github.com|g' api/v1/discover.json
        sed -i 's|github\.com|v6.gh-proxy.org/https://github.com|g' api/v1/appapi_apps.json

    # 步骤4：提交更改
    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: '每日自动更新API v1'
        file_pattern: api/v1/*.json
        commit_user_name: GitHub Actions
        commit_user_email: actions@github.com

